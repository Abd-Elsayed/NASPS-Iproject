<nav class="pagination" aria-label="List pagination">
  <span class="page-summary">Showing {{ firstItem() }}–{{ lastItem() }} of {{ totalItems() }}</span>
  <div class="page-buttons">
    <button
      type="button"
      aria-label="Previous page"
      [disabled]="page() <= 1"
      (click)="goTo(page() - 1)"
    >
      ‹
    </button>
    @for (pageNumber of pages(); track pageNumber) {
      <button
        type="button"
        [class.active]="pageNumber === page()"
        [attr.aria-current]="pageNumber === page() ? 'page' : null"
        (click)="goTo(pageNumber)"
      >
        {{ pageNumber }}
      </button>
    }
    <button
      type="button"
      aria-label="Next page"
      [disabled]="page() >= totalPages()"
      (click)="goTo(page() + 1)"
    >
      ›
    </button>
  </div>
</nav>
