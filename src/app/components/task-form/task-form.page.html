<div class="page-heading"><div><span class="eyebrow">WORKFLOW</span><h1>Add New Task</h1><p>Create a clear assignment for one trainee or the full trainee group.</p></div></div>
<form class="panel form-panel" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="form-grid">
    <label class="span-2">Title<input formControlName="title" placeholder="Enter task title">@if (form.controls.title.touched && form.controls.title.invalid) { <small class="field-error">Enter a title containing at least 3 characters.</small> }</label>
    <label class="span-2">Description<textarea formControlName="description" rows="5" placeholder="Enter task description"></textarea>@if (form.controls.description.touched && form.controls.description.invalid) { <small class="field-error">Description must contain at least 10 characters.</small> }</label>
    <label>Assign Trainee<select formControlName="traineeId"><option [ngValue]="0">Select trainee</option><option [ngValue]="'all'">All trainees</option>@for (trainee of trainees(); track trainee.id) { <option [ngValue]="trainee.id">{{ trainee.name }} — {{ trainee.internshipProgram }}</option> }</select>@if (form.controls.traineeId.touched && form.controls.traineeId.invalid) { <small class="field-error">Select one trainee or All trainees.</small> }</label>
    <label>Priority<select formControlName="priority"><option>High</option><option>Medium</option><option>Low</option></select></label>
    <label>Due Date<input type="date" formControlName="dueDate">@if (form.controls.dueDate.touched && form.controls.dueDate.invalid) { <small class="field-error">Due date is required.</small> }</label>
    <label class="attachment-field">Task Attachment (any file or image)
      <input type="file" (change)="onAttachmentSelected($event)">
      @if (selectedAttachment) { <span class="selected-file">{{ selectedAttachment.name }} · {{ formatFileSize(selectedAttachment.size) }}</span> }
      @if (attachmentError) { <small class="field-error">{{ attachmentError }}</small> }
      <small class="file-help">Any file type is accepted. Maximum size: 20 MB.</small>
    </label>
    <label class="span-2">Instructions<textarea formControlName="instructions" rows="3" placeholder="Add useful instructions"></textarea></label>
  </div>
  @if (submitted && form.invalid) { <p class="form-error">The task could not be created. Check the highlighted fields.</p> }
  <div class="form-actions"><a class="secondary-button" routerLink="/admin/tasks">Cancel</a><button class="primary-button" type="submit">Create Task</button></div>
</form>
